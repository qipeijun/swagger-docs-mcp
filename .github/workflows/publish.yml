name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: 检出发布版本
        uses: actions/checkout@v6
      - name: 配置 Node.js 和 npm Registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 校验发布标签与包版本
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: 发布并生成来源证明
        run: npm publish --access public --provenance
      - name: 验证已发布精确版本
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          REGISTRY_VERSION="$(npm view "${PACKAGE_SPEC}" version)"
          test "${REGISTRY_VERSION}" = "${PACKAGE_VERSION}"

          SMOKE_DIRECTORY="$(mktemp -d "${RUNNER_TEMP}/swagger-docs-mcp-publish-smoke.XXXXXX")"
          cd "${SMOKE_DIRECTORY}"
          test "$(npx --yes "${PACKAGE_SPEC}" --version)" = "${PACKAGE_VERSION}"
          DOCTOR_JSON="$(npx --yes "${PACKAGE_SPEC}" doctor --json)"
          node --input-type=module --eval '
            const report = JSON.parse(process.argv[1]);
            const expectedVersion = process.argv[2];
            if (report.status !== "ok" || report.packageVersion !== expectedVersion) {
              throw new Error(`发布后诊断失败：${JSON.stringify(report)}`);
            }
          ' "${DOCTOR_JSON}" "${PACKAGE_VERSION}"
