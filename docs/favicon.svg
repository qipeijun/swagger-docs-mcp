<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 文档本体 -->
  <rect x="3" y="2" width="20" height="28" rx="3" stroke="#1B5E3C" stroke-width="2.5" fill="#FCFAF7"/>

  <!-- 文档折角内页 -->
  <path d="M17 2l6 6H18a1 1 0 01-1-1V2z" fill="#E8EDE5"/>

  <!-- 文档内文行 -->
  <rect x="7" y="12" width="10" height="1.5" rx="0.75" fill="#C4D4C0"/>
  <rect x="7" y="16" width="13" height="1.5" rx="0.75" fill="#C4D4C0"/>
  <rect x="7" y="20" width="9"  height="1.5" rx="0.75" fill="#C4D4C0"/>

  <!-- 连接点：文档右上角发出的节点，表示 MCP 协议桥接 -->
  <circle cx="26" cy="8" r="4" fill="#1B5E3C"/>
  <path d="M23 8l-2.5 0" stroke="#1B5E3C" stroke-width="2.5" stroke-linecap="round"/>
</svg>
